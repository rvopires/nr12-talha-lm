<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prévia das fotos do curso</title>
<style>
:root{--bg:#0f2a35;--card:#17333f;--line:#2c5667;--ink:#fff;--mut:#9fc2cf;--ac:#cafFA7;--ok:#34af77;--warn:#ffb454}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Montserrat,"Open Sans",Arial,sans-serif}
header{position:sticky;top:0;z-index:5;background:rgba(15,42,53,.96);border-bottom:1px solid var(--line);padding:14px 20px;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center}
h1{font-size:18px;margin:0;color:var(--ac)}
.sum{color:var(--mut);font-size:14px}.sum b{color:#fff}
label{display:flex;gap:6px;align-items:center;cursor:pointer;color:var(--mut);font-size:14px}
main{max-width:1180px;margin:0 auto;padding:20px}
.mod{margin:30px 0 8px;font-size:15px;font-weight:800;color:var(--ac);text-transform:uppercase;letter-spacing:.06em}
.pg{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:14px 0}
.pg h2{margin:0 0 4px;font-size:16px}.pg h2 small{color:var(--mut);font-weight:600;margin-left:8px}
.pg p.d{margin:0 0 12px;color:var(--mut);font-size:13px}
.tag{display:inline-block;padding:1px 9px;border-radius:99px;font-size:11px;font-weight:800;margin-left:8px;background:#0f2a35;border:1px solid var(--line);color:var(--mut)}
.slot{position:relative;border-radius:12px;overflow:hidden;background:#0f2a35;border:2px dashed var(--warn);display:grid;place-items:center;text-align:center;color:var(--warn);font-size:12px}
.slot.ok{border:2px solid var(--ok)}
.slot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slot .nm{position:relative;padding:6px;font-family:Consolas,monospace;font-weight:700;color:var(--warn)}
.slot .nm small{display:block;color:var(--mut);font-weight:400;font-family:inherit;margin-top:2px}
.slot.ok .nm{display:none}
.r11{aspect-ratio:1/1}.r21{aspect-ratio:2/1}.r169{aspect-ratio:16/9}
.cards{display:grid;gap:12px}
.c{background:#0f2a35;border:1px solid var(--line);border-radius:12px;padding:10px}
.c b{display:block;font-size:13px;margin:8px 0 2px}.c span{display:block;font-size:12px;color:var(--mut)}
.list .it{display:grid;grid-template-columns:110px 1fr;gap:12px;align-items:center;background:#0f2a35;border:1px solid var(--line);border-radius:12px;padding:8px;margin:8px 0}
.it b{font-size:13px}.it span{display:block;font-size:12px;color:var(--mut)}
.opts{display:grid;gap:8px;margin-top:10px}.opt{background:#0f2a35;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:12px;color:var(--mut)}
.note{font-size:12px;color:var(--mut);margin-top:10px}
.nofoto{color:var(--mut);font-size:13px;font-style:italic}
</style></head><body>
<header><h1>Prévia das fotos do curso</h1><div class="sum" id="sum"></div>
<label><input type="checkbox" id="onlyMiss" checked> só páginas com foto faltando</label>
<label><input type="checkbox" id="allPg"> mostrar também as páginas sem foto</label></header>
<main id="m"></main>
<script src="question-screen-data.js"></script>
<script>
var S=window.QUESTION_SCREEN_SESSION, host=document.getElementById('m'), pg=3, have=0, total=0, items=[];
function esc(t){return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/<[^>]+>/g,'')}
function slot(src,alt,r){
  var n=src.split('/').pop(); total++;
  var id='s'+total;
  return '<div class="slot '+r+'" id="'+id+'" data-src="'+src+'"><img alt="" data-id="'+id+'"><div class="nm">'+esc(n)+'<small>'+esc(alt||'')+'</small></div></div>';
}
S.modules.forEach(function(m){
  var md='<div class="mod">Módulo '+m.id+' — '+esc(m.title)+'</div>'; var any=false, buf='';
  m.screens.forEach(function(s){
    var body='', imgs=0;
    if(s.type==='cover'){ body='<div style="max-width:620px">'+slot(s.image,s.imageAlt,'r169')+'</div><p class="note">Capa do módulo: foto larga 16:9 com o título por cima.</p>'; imgs=1; }
    else if(s.type==='content' && s.cards && s.layout==='resp'){
      var n=s.cards.length, cols=n>=5?5:n; imgs=n;
      body='<div class="cards" style="grid-template-columns:repeat('+cols+',1fr)">'+s.cards.map(function(c){return '<div class="c">'+slot(c.image,c.imageAlt,'r11')+'<b>'+esc(c.title)+'</b><span>'+esc(c.body).slice(0,90)+(c.body.length>90?'…':'')+'</span></div>'}).join('')+'</div><p class="note">Cartões lado a lado. Cada foto é quadrada (1:1) e aparece inteira acima do texto.</p>';
    }
    else if(s.type==='content' && s.cards && s.layout==='duo'){
      imgs=s.cards.length;
      body='<div class="cards" style="grid-template-columns:repeat('+s.cards.length+',1fr)">'+s.cards.map(function(c){return '<div class="c">'+slot(c.thumbs[0],c.title,'r169')+'<b>'+esc(c.lead)+' — '+esc(c.title)+'</b><span>'+esc(c.body)+'</span></div>'}).join('')+'</div>'+(s.items?'<div class="c" style="margin-top:12px"><b>'+esc(s.items[0].title)+'</b><span>'+esc(s.items[0].text)+'</span></div>':'')+'<p class="note">Dois cartões grandes com foto horizontal (3:2) e um aviso embaixo.</p>';
    }
    else if(s.type==='content' && (s.groups || (s.items && s.layout!=='quickcards'))){
      var its=s.groups?[].concat.apply([],s.groups.map(function(g){return g.items})):s.items;
      its=its.filter(function(i){return i.image}); imgs=its.length;
      var nm={flipz:'Cartões que viram: foto quadrada na frente (1:1); ao tocar, mostra o texto atrás.',zigzag:'Zigue-zague: foto quadrada (1:1) alternando em cima e embaixo, com o texto ao lado.','lista-foto':'Lista à esquerda e UMA foto grande à direita, que troca a cada requisito. Foto quadrada (1:1).',mural:'Mural: miniatura quadrada (1:1) ao lado do nome; o botão destaca um de cada vez.',acordeao:'Faixas coloridas em pé; a aberta mostra a foto quadrada (1:1) e o texto.',zonas:'Cartões grandes com foto quadrada (1:1).'}[s.layout]||'Foto quadrada (1:1).';
      body='<div class="cards" style="grid-template-columns:repeat('+Math.min(its.length,5)+',1fr)">'+its.map(function(i,k){return '<div class="c">'+slot(i.image,i.imageAlt,'r11')+'<b>'+(k+1)+'. '+esc(i.title)+'</b></div>'}).join('')+'</div><p class="note">Formato desta página: <b>'+esc(s.layout)+'</b>. '+nm+'</p>';
    }
    else if(s.type==='content' && s.items && s.layout==='quickcards'){
      imgs=s.items.filter(function(i){return i.image}).length;
      body='<div class="list">'+s.items.map(function(i){return '<div class="it">'+(i.image?slot(i.image,i.imageAlt,'r11'):'<div></div>')+'<div><b>'+esc(i.title)+'</b><span>'+esc(i.text)+'</span></div></div>'}).join('')+'</div><p class="note">Lista de itens: cada foto é uma miniatura quadrada (1:1) à esquerda do texto.</p>';
    }
    else if(s.type==='question' && s.image){
      imgs=1;
      body='<div style="max-width:760px">'+slot(s.image,s.imageAlt,'r21')+'<div class="opts">'+s.alternatives.map(function(a,i){return '<div class="opt">'+'ABC'.charAt(i)+') '+esc(a.text)+'</div>'}).join('')+'</div></div><p class="note">Pergunta: foto larga (2:1) em cima e as 3 respostas embaixo. A foto não pode dar a resposta.</p>';
    }
    var d='';
    if(imgs){ any=true; }
    var label={cover:'capa do módulo',content:'texto',video:'vídeo',question:'pergunta','quiz-intro':'abertura do desafio',match:'ligar pares',sort:'classificar',fill:'completar',finale:'final'}[s.type]||s.type;
    items.push({n:pg,imgs:imgs});
    buf+='<section class="pg" data-imgs="'+imgs+'" data-n="'+pg+'"><h2>Página '+pg+'<small>'+esc(s.title||s.question||'')+'</small><span class="tag">'+label+'</span></h2>'+(imgs?body:'<p class="nofoto">Esta página não leva foto.</p>')+'</section>';
    pg++;
  });
  host.insertAdjacentHTML('beforeend',md+buf);
});
function refresh(){
  var only=document.getElementById('onlyMiss').checked, all=document.getElementById('allPg').checked;
  document.querySelectorAll('.pg').forEach(function(p){
    var has=+p.dataset.imgs>0, miss=p.querySelector('.slot:not(.ok)');
    p.style.display=(!all&&!has)?'none':(only&&has&&!miss?'none':'');
  });
  have=document.querySelectorAll('.slot.ok').length;
  document.getElementById('sum').innerHTML='Fotos: <b>'+have+'</b> prontas de <b>'+total+'</b> · faltam <b>'+(total-have)+'</b>';
}
document.querySelectorAll('.slot').forEach(function(sl){
  var img=sl.querySelector('img'); img.onload=function(){sl.classList.add('ok');refresh()}; img.onerror=function(){img.remove();refresh()};
  img.src=sl.dataset.src+'?v='+Date.now();
});
document.getElementById('onlyMiss').onchange=document.getElementById('allPg').onchange=refresh; refresh();
</script></body></html>
